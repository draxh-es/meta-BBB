# 1. Bitbake'in bu katmandaki conf/ ve classes/ dosyalarini bulabilmesi
BBPATH .= ":${LAYERDIR}"

# 2. Tarif dosyalarinin yeri: recipes-<kategori>/<tarif>/<dosya>
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# 3. Katmanin kimligi: adi, hangi dosyalarin ona ait oldugu, onceligi
BBFILE_COLLECTIONS += "agl-bbb"
BBFILE_PATTERN_agl-bbb = "^${LAYERDIR}/"
BBFILE_PRIORITY_agl-bbb = "10"

# Katmanda henuz tarif yok; "No bb files matched" uyarisini bastir
BBFILE_PATTERN_IGNORE_EMPTY_agl-bbb = "1"

# 4. Bagimliliklar ve uyumlu Yocto surumu
LAYERDEPENDS_agl-bbb = "core aglcore meta-beagle"
LAYERSERIES_COMPAT_agl-bbb = "scarthgap"
